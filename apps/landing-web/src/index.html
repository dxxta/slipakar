<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slipakar — Self-hosted personalized bulk email</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const theme = localStorage.getItem('slipakar.landing-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
    <meta name="landing-runtime-config" content="{&quot;appUrl&quot;:&quot;http://localhost:8080&quot;,&quot;siteUrl&quot;:&quot;http://localhost:8082&quot;,&quot;repoUrl&quot;:&quot;http://localhost:8082/#open-source&quot;,&quot;docsUrl&quot;:&quot;http://localhost:8082/#self-host&quot;}" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
