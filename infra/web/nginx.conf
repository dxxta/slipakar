upstream api {
    server ${API_UPSTREAM};
}

# Browser page navigations under /projects belong to Angular; API requests stay proxied.
map "$request_method:$http_accept" $user_projects_html {
    default 0;
    ~*^GET:.*text/html /index.html;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript application/json image/svg+xml text/css text/javascript;

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html/user;
    index index.html;
    client_max_body_size 50m;

    include /etc/nginx/security-headers.conf;
    include /etc/nginx/robots-header.conf;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_intercept_errors off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /api/ { proxy_pass http://api; }
    location = /health { proxy_pass http://api; }
    location = /docs {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lmba+p2ZA26l0frITlGt+zVDpF9V987twNchN6VQgQ8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.googleusercontent.com https://tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        include /etc/nginx/robots-header.conf;
        proxy_pass http://api;
    }
    location ^~ /docs/ { proxy_pass http://api; }
    location = /openapi.json { proxy_pass http://api; }
    location ^~ /admin/ { proxy_pass http://api; }

    location = /notifications/unread-count {
        proxy_hide_header Vary;
        proxy_hide_header Cache-Control;
        gzip_vary off;
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
        proxy_pass http://api;
    }
    location ^~ /me/ {
        proxy_hide_header Vary;
        proxy_hide_header Cache-Control;
        gzip_vary off;
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
        proxy_pass http://api;
    }

    location = /projects {
        gzip_vary off;
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
        if ($user_projects_html) { rewrite ^ /index.html break; }
        try_files $uri @user_api;
    }
    location ^~ /projects/ {
        gzip_vary off;
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
        if ($user_projects_html) { rewrite ^ /index.html break; }
        try_files $uri @user_api;
    }

    location @user_api {
        proxy_hide_header Vary;
        proxy_hide_header Cache-Control;
        gzip_vary off;
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
        proxy_pass http://api;
    }

    location = /console {
        return 301 /console/;
    }
    location ^~ /console/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
        try_files $uri $uri/ /console/index.html;

        location = /console/index.html {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/robots-header.conf;
        }
        location ~* "-[A-Za-z0-9_-]{8,}\.(?:js|css|svg|woff2?|png|jpe?g|webp)$" {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/robots-header.conf;
        }
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
    }

    location ~* "-[A-Za-z0-9_-]{8,}\.(?:js|css|svg|woff2?|png|jpe?g|webp)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/robots-header.conf;
    }

    location / { try_files $uri $uri/ /index.html; }
}
