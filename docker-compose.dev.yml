# Development infrastructure for the whole repository (make dev-infra-up): db, cache, queue and storage in Docker.
# Own Compose project and volumes, separate from docker-compose.yml and from apps/api/docker-compose.yml (different host ports).
# Every value is a throwaway local-development constant matching the URLs printed by make dev-infra-up.
name: slipakar-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: slipakar
      POSTGRES_DB: slipakar
      POSTGRES_PASSWORD: slipakar_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slipakar -d slipakar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: slipakar
      RABBITMQ_DEFAULT_PASS: slipakar_dev
    ports:
      - "127.0.0.1:5674:5672"
    volumes:
      - dev_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    environment:
      GARAGE_RPC_SECRET: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      GARAGE_ADMIN_TOKEN: "00112233445566778899aabbccddeeff0011223344556677"
      GARAGE_METRICS_TOKEN: ""
    ports:
      - "127.0.0.1:3911:3900"
    volumes:
      - dev_garage_meta:/var/lib/garage/meta
      - dev_garage_data:/var/lib/garage/data
      - ./infra/garage/garage.toml:/etc/garage/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: curlimages/curl
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN: "00112233445566778899aabbccddeeff0011223344556677"
      S3_ACCESS_KEY: "GK0123456789abcdef01234567"
      S3_SECRET_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      S3_BUCKET: "slipakar"
    volumes:
      - ./infra/garage/bootstrap.sh:/bootstrap.sh:ro

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./infra/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - dev_prometheus:/prometheus

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: slipakar_dev_grafana
    volumes:
      - dev_grafana:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  uptime-kuma:
    profiles: ["monitoring"]
    image: louislam/uptime-kuma:1.23.17
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:3001"
    volumes:
      - dev_uptime_kuma:/app/data
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 180s

  kuma-init:
    profiles: ["monitoring"]
    image: louislam/uptime-kuma:1.23.17
    entrypoint: ["node", "/init/kuma-init.mjs"]
    restart: "no"
    depends_on:
      uptime-kuma:
        condition: service_healthy
    environment:
      NODE_PATH: /app/node_modules
      UPTIME_KUMA_ADMIN_USER: admin
      UPTIME_KUMA_ADMIN_PASSWORD: slipakar_dev_admin
      KUMA_MONITOR_LANDING: "false"
      KUMA_MONITOR_API_URL: "http://host.docker.internal:3000/health"
      KUMA_MONITOR_WEB_URL: "http://host.docker.internal:4300/"
      KUMA_MONITOR_ADMIN_URL: "http://host.docker.internal:4301/"
      KUMA_MONITOR_LANDING_URL: "http://host.docker.internal:4302/"
    volumes:
      - ./infra/uptime-kuma/kuma-init.mjs:/init/kuma-init.mjs:ro

volumes:
  dev_postgres:
  dev_rabbitmq:
  dev_garage_meta:
  dev_garage_data:
  dev_prometheus:
  dev_grafana:
  dev_uptime_kuma:
