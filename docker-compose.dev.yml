# Development infrastructure for the whole repository (make dev-infra-up): db, cache, queue and storage in Docker.
# Own Compose project and volumes, separate from docker-compose.yml and from apps/api/docker-compose.yml (different host ports).
# Every value is a throwaway local-development constant matching the URLs printed by make dev-infra-up.
name: slipakar-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: slipakar
      POSTGRES_DB: slipakar
      POSTGRES_PASSWORD: slipakar_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slipakar -d slipakar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: slipakar
      RABBITMQ_DEFAULT_PASS: slipakar_dev
    ports:
      - "127.0.0.1:5674:5672"
    volumes:
      - dev_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    environment:
      GARAGE_RPC_SECRET: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      GARAGE_ADMIN_TOKEN: "00112233445566778899aabbccddeeff0011223344556677"
      GARAGE_METRICS_TOKEN: ""
    ports:
      - "127.0.0.1:3911:3900"
    volumes:
      - dev_garage_meta:/var/lib/garage/meta
      - dev_garage_data:/var/lib/garage/data
      - ./infra/garage/garage.toml:/etc/garage/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: curlimages/curl
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN: "00112233445566778899aabbccddeeff0011223344556677"
      S3_ACCESS_KEY: "GK0123456789abcdef01234567"
      S3_SECRET_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      S3_BUCKET: "slipakar"
    volumes:
      - ./infra/garage/bootstrap.sh:/bootstrap.sh:ro

volumes:
  dev_postgres:
  dev_rabbitmq:
  dev_garage_meta:
  dev_garage_data:
